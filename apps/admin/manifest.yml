---
# SAP BTP Cloud Foundry deploy descriptor — Admin
# Global account: UST Global Inc · Subaccount: BUILD_AI_SUBACCOUNT
# CF org:         org-build-build-ai-subaccount
# CF space:       code_migration_space
# API:            https://api.cf.us10-001.hana.ondemand.com
#
# `services: [ust-portfolio-db]` auto-binds the existing free-plan Hyperscaler
# Postgres at push time. The bound credentials are injected via VCAP_SERVICES
# and parsed by lib/db/client.ts getDatabaseUrl().
#
# Image is overridden at deploy time via:
#   cf push -f apps/admin/manifest.yml \
#     --docker-image ghcr.io/jpg-account/ust-ai-suiteplus-portal-admin:sha-<digest>
#
# After push, set required env vars (do NOT commit secrets):
#   cf set-env ust-ai-suiteplus-portal-admin SUPER_ADMIN_EMAIL "john.galido@ust.com"
#   cf set-env ust-ai-suiteplus-portal-admin AUTH_PASSWORD_PEPPER "$(openssl rand -hex 32)"
#   cf set-env ust-ai-suiteplus-portal-admin REVALIDATE_SECRET "$(openssl rand -hex 32)"
#   cf set-env ust-ai-suiteplus-portal-admin PORTAL_BASE_URL "https://ust-ai-suiteplus-portal.cfapps.us10-001.hana.ondemand.com"
#   cf set-env ust-ai-suiteplus-portal-admin NEXT_PUBLIC_PORTAL_BASE_URL "https://ust-ai-suiteplus-portal.cfapps.us10-001.hana.ondemand.com"
#   cf set-env ust-ai-suiteplus-portal-admin ADMIN_BASE_URL "https://ust-ai-suiteplus-portal-admin.cfapps.us10-001.hana.ondemand.com"
#   cf restart ust-ai-suiteplus-portal-admin
#
# Schema + super-admin user lazy-init on first DB-touching request
# (see lib/db/ensure-db.ts). Watch `cf logs --recent | grep set-password`
# for the one-shot URL to set the super-admin password.
applications:
  - name: ust-ai-suiteplus-portal-admin
    instances: 1
    memory: 1G
    disk_quota: 1G
    stack: cflinuxfs4
    docker:
      image: ghcr.io/jpg-account/ust-ai-suiteplus-portal-admin:latest
    routes:
      - route: ust-ai-suiteplus-portal-admin.cfapps.us10-001.hana.ondemand.com
    services:
      - ust-portfolio-db
    health-check-type: http
    health-check-http-endpoint: /api/health
    health-check-invocation-timeout: 10
    timeout: 180
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      AUTH_PROVIDER: local
