---
# SAP BTP Cloud Foundry deploy descriptor — Portal
# Global account: UST Global Inc · Subaccount: BUILD_AI_SUBACCOUNT
# CF org:         org-build-build-ai-subaccount
# CF space:       code_migration_space
# API:            https://api.cf.us10-001.hana.ondemand.com
#
# Image is overridden at deploy time via:
#   cf push -f apps/portal/manifest.yml \
#     --docker-image ghcr.io/jpg-account/ust-ai-suiteplus-portal:sha-<digest>
#
# Prerequisite: GHCR package must be PUBLIC for anonymous pull (set at
# https://github.com/orgs/JPG-Account/packages → package settings).
applications:
  - name: ust-ai-suiteplus-portal
    instances: 1
    memory: 512M
    disk_quota: 1G
    stack: cflinuxfs4
    docker:
      image: ghcr.io/jpg-account/ust-ai-suiteplus-portal:latest
    routes:
      - route: ust-ai-suiteplus-portal.cfapps.us10-001.hana.ondemand.com
    health-check-type: http
    health-check-http-endpoint: /api/health
    health-check-invocation-timeout: 10
    timeout: 120
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
